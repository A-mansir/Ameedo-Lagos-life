<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lagos Life | Street Hustle</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--gold:#f6c343;--green:#20c997;--red:#ff4d5d;--dark:#07121f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b12;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{touch-action:none;color:#fff}
#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#7fc8ef 0 28%,#a8d9a0 28% 100%)}
#world{position:absolute;inset:0;overflow:hidden}
.skyline{position:absolute;left:0;right:0;bottom:58%;height:22%;opacity:.9}
.building{position:absolute;bottom:0;background:#61727d;border-radius:2px 2px 0 0;box-shadow:inset 0 0 0 1px #50616a}
.building:after{content:"";position:absolute;inset:8px;background:repeating-linear-gradient(90deg,#e8d58c 0 6px,transparent 6px 15px),repeating-linear-gradient(0deg,transparent 0 11px,#d6c77d 11px 16px);opacity:.35}
#road{position:absolute;left:0;right:0;top:20%;bottom:0;background:#30343a;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.roadEdge{position:absolute;top:20%;bottom:0;width:5px;background:#f8d94d;z-index:2}
.roadEdge.l{left:calc(18% - 2px);transform:skewX(-13deg)}
.roadEdge.r{right:calc(18% - 2px);transform:skewX(13deg)}
.lane{position:absolute;top:20%;bottom:-5%;width:7px;background:repeating-linear-gradient(to bottom,#eee 0 50px,transparent 50px 105px);opacity:.75;z-index:2}
.lane.a{left:39%;transform:skewX(-5deg)} .lane.b{left:61%;transform:skewX(5deg)}
#objects{position:absolute;inset:0;z-index:5;overflow:hidden}
.vehicle{position:absolute;width:58px;height:105px;border-radius:12px;box-shadow:0 8px 15px #0008;display:flex;align-items:center;justify-content:center;font-size:30px;user-select:none}
.vehicle.danfo{background:#f7d331;border:4px solid #111;color:#111}
.vehicle.okada{width:42px;height:70px;background:#191f25;border:3px solid #111;font-size:25px}
.vehicle.car{background:#cfd7dc;border:3px solid #39434a}
.vehicle.police{background:#182b62;border:3px solid #fff}
#player{position:absolute;width:62px;height:112px;bottom:14%;left:50%;transform:translateX(-50%);z-index:10;border-radius:13px;background:linear-gradient(90deg,#09294b,#1683bd 45%,#071c32);border:3px solid #f7d331;box-shadow:0 10px 20px #0009;display:flex;align-items:center;justify-content:center;font-size:31px}
#player .plate{position:absolute;bottom:8px;background:#f7d331;color:#111;font-weight:800;font-size:7px;padding:2px 5px;border-radius:2px}
.hud{position:absolute;z-index:30;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 12px 8px;display:flex;justify-content:space-between;gap:8px;background:linear-gradient(#06111de8,transparent)}
.statbar{display:flex;gap:6px;flex-wrap:wrap}
.stat{background:#07121fd9;border:1px solid #ffffff25;border-radius:10px;padding:6px 9px;font-size:12px;font-weight:700;backdrop-filter:blur(6px)}
.stat i{color:var(--gold);margin-right:4px}
#mission{position:absolute;z-index:30;top:68px;left:50%;transform:translateX(-50%);width:min(420px,75vw);background:#07121fd9;border:1px solid #ffffff2b;border-radius:12px;padding:8px 12px;text-align:center;font-size:12px;backdrop-filter:blur(6px)}
#mission b{color:var(--gold)}
.controls{position:absolute;z-index:40;left:0;right:0;bottom:0;padding:10px 16px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.controlGroup{display:flex;gap:10px;pointer-events:auto}
.ctrl{width:58px;height:58px;border:1px solid #ffffff35;border-radius:50%;background:#07121fe8;color:white;font-size:24px;box-shadow:0 5px 14px #0008;display:grid;place-items:center}
.ctrl:active,.ctrl.active{background:#17466a;transform:scale(.94)}
.ctrl.acc{background:#168b60}.ctrl.brake{background:#a73543}
.menuBtn{position:absolute;z-index:50;right:12px;top:60px;width:42px;height:42px;border-radius:12px;border:1px solid #fff3;background:#07121fd9;color:#fff}
#overlay{position:absolute;z-index:100;inset:0;background:#030913dd;display:none;align-items:center;justify-content:center;padding:20px}
.panel{width:min(470px,92vw);background:#0a1826;border:1px solid #ffffff1c;border-radius:22px;padding:24px;text-align:center;box-shadow:0 25px 80px #000b}
.panel h1{font-weight:900;color:var(--gold)}
.bigbtn{border:0;border-radius:12px;padding:12px 18px;font-weight:800}
#toast{position:absolute;z-index:90;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:#07121fee;border:1px solid #ffffff25;border-radius:14px;padding:12px 18px;opacity:0;pointer-events:none;transition:.2s;text-align:center;min-width:190px}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.progress{height:5px;background:#ffffff1b}.progress-bar{background:var(--green)}
.rotate{display:none}
@media (orientation:portrait) and (max-width:700px){
 .rotate{display:flex;position:absolute;z-index:200;inset:0;background:#06101ceF;align-items:center;justify-content:center;text-align:center;padding:30px}
 .rotate div{font-size:18px;font-weight:800}.rotate i{font-size:45px;color:var(--gold);display:block;margin-bottom:12px}
}
@media (max-height:430px){
 .hud{padding-top:5px}.stat{padding:4px 7px;font-size:10px}#mission{top:48px;padding:5px 8px;font-size:10px}.menuBtn{top:45px}.ctrl{width:52px;height:52px}.controls{padding-bottom:5px}
}
</style>
</head>
<body>
<div id="game">
 <div id="world">
  <div class="skyline" id="skyline"></div>
  <div id="road"></div><div class="roadEdge l"></div><div class="roadEdge r"></div>
  <div class="lane a"></div><div class="lane b"></div>
  <div id="objects"></div><div id="player"><span>🚙</span><small class="plate">LAGOS</small></div>
 </div>

 <div class="hud">
  <div class="statbar">
   <div class="stat"><i class="bi bi-cash-stack"></i><span id="cash">₦5,000</span></div>
   <div class="stat"><i class="bi bi-fuel-pump"></i><span id="fuel">100%</span></div>
   <div class="stat"><i class="bi bi-star-fill"></i><span id="rep">0</span></div>
   <div class="stat"><i class="bi bi-speedometer2"></i><span id="speed">0</span> km/h</div>
  </div>
 </div>
 <button class="menuBtn" id="pauseBtn"><i class="bi bi-pause-fill"></i></button>
 <div id="mission">📦 <b>Mission:</b> Pick up a delivery around Ikeja and earn ₦2,500.</div>
 <div id="toast"></div>

 <div class="controls">
  <div class="controlGroup">
   <button class="ctrl" data-key="ArrowLeft"><i class="bi bi-arrow-left"></i></button>
   <button class="ctrl" data-key="ArrowRight"><i class="bi bi-arrow-right"></i></button>
  </div>
  <div class="controlGroup">
   <button class="ctrl brake" data-key="ArrowDown"><i class="bi bi-stop-fill"></i></button>
   <button class="ctrl acc" data-key="ArrowUp"><i class="bi bi-lightning-fill"></i></button>
  </div>
 </div>

 <div id="overlay">
  <div class="panel">
   <div style="font-size:46px">🇳🇬🚙</div>
   <h1 id="panelTitle">LAGOS LIFE</h1>
   <p id="panelText" class="text-white-50">Street hustle starts now.</p>
   <div class="row g-2 mb-3">
    <div class="col-4"><div class="stat">Cash<br><span id="endCash">₦5,000</span></div></div>
    <div class="col-4"><div class="stat">Reputation<br><span id="endRep">0</span></div></div>
    <div class="col-4"><div class="stat">Jobs<br><span id="endJobs">0</span></div></div>
   </div>
   <button class="bigbtn btn btn-warning w-100" id="startBtn">START HUSTLE</button>
  </div>
 </div>
 <div class="rotate"><div><i class="bi bi-phone-landscape"></i>Rotate your phone<br>to play Lagos Life</div></div>
</div>

<script>
(() => {
 const $=id=>document.getElementById(id);
 const objects=$('objects');
 const keys={ArrowLeft:false,ArrowRight:false,ArrowUp:false,ArrowDown:false};
 let state={cash:5000,fuel:100,rep:0,speed:0,x:50,roadTime:0,jobs:0,paused:true,gameOver:false,spawn:0,mission:0};
 let vehicles=[], last=performance.now(), toastTimer;

 const missions=[
  ['📦','Pick up a delivery around Ikeja and earn ₦2,500.',2500],
  ['🛵','Beat the traffic and deliver food to Yaba.',3200],
  ['🧰','Take a mechanic job to Surulere.',4200],
  ['📦','Move a package from Apapa to Victoria Island.',5500],
  ['💼','Complete a VIP ride to Lekki.',7000]
 ];

 function money(n){return '₦'+Math.max(0,Math.round(n)).toLocaleString()}
 function updateHUD(){
  $('cash').textContent=money(state.cash); $('fuel').textContent=Math.round(state.fuel)+'%';
  $('rep').textContent=state.rep; $('speed').textContent=Math.round(state.speed);
  const m=missions[state.mission%missions.length];
  $('mission').innerHTML=m[0]+' <b>Mission:</b> '+m[1]+' <span class="text-success fw-bold">+'+money(m[2])+'</span>';
 }
 function toast(msg){
  $('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500);
 }
 function makeSkyline(){
  for(let i=0;i<18;i++){let b=document.createElement('div');b.className='building';b.style.left=(i*6+Math.random()*3)+'%';b.style.width=(4+Math.random()*4)+'%';b.style.height=(35+Math.random()*65)+'%';$('skyline').appendChild(b)}
 }
 function spawn(){
  const v=document.createElement('div'), types=['danfo','car','car','okada','police'];
  const type=types[Math.floor(Math.random()*types.length)];
  v.className='vehicle '+type; v.innerHTML=type==='danfo'?'🚌':type==='okada'?'🏍️':type==='police'?'🚓':'🚗';
  const lane=[30,42,55,68][Math.floor(Math.random()*4)];
  v.style.left=lane+'%';v.style.top='-130px';objects.appendChild(v);
  vehicles.push({el:v,x:lane,y:-130,speed:80+Math.random()*90,type});
 }
 function hit(a,b){
  const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
  return ar.left<br.right-8&&ar.right>br.left+8&&ar.top<br.bottom-8&&ar.bottom>br.top+8;
 }
 function refuel(){
  if(state.fuel<25 && state.cash>=1000){state.cash-=1000;state.fuel=100;toast('⛽ Tank filled • −₦1,000');updateHUD()}
 }
 function finishJob(){
  const reward=missions[state.mission%missions.length][2];
  state.cash+=reward;state.rep++;state.jobs++;state.mission++;
  toast('🎉 Job complete! +'+money(reward));updateHUD();
 }
 function crash(){
  state.cash=Math.max(0,state.cash-500);state.rep=Math.max(0,state.rep-1);state.speed=0;
  toast('💥 Omo! Accident • −₦500');updateHUD();
 }
 function togglePause(force){
  state.paused=force??!state.paused;
  $('overlay').style.display=state.paused?'flex':'none';
  $('panelTitle').textContent=state.gameOver?'GAME OVER':'LAGOS LIFE';
  $('panelText').textContent=state.gameOver?'Your hustle has ended. Try again and beat your score.':'Paused. Ready to continue the hustle?';
  $('startBtn').textContent=state.gameOver?'PLAY AGAIN':'RESUME';
  $('endCash').textContent=money(state.cash);$('endRep').textContent=state.rep;$('endJobs').textContent=state.jobs;
 }
 function reset(){
  vehicles.forEach(v=>v.el.remove());vehicles=[];state={cash:5000,fuel:100,rep:0,speed:0,x:50,roadTime:0,jobs:0,paused:false,gameOver:false,spawn:0,mission:0};
  $('overlay').style.display='none';updateHUD();toast('🚦 Welcome to Lagos. Drive safe!');
 }
 function frame(now){
  const dt=Math.min(.04,(now-last)/1000);last=now;
  if(!state.paused&&!state.gameOver){
   const accel=keys.ArrowUp?180:keys.ArrowDown?-260:-25;
   state.speed=Math.max(0,Math.min(180,state.speed+accel*dt));
   if(keys.ArrowLeft)state.x-=48*dt*(.5+state.speed/120);
   if(keys.ArrowRight)state.x+=48*dt*(.5+state.speed/120);
   state.x=Math.max(25,Math.min(75,state.x));
   $('player').style.left=state.x+'%';
   state.fuel=Math.max(0,state.fuel-state.speed*dt*.004);
   if(state.fuel<=0){state.speed=Math.max(0,state.speed-100*dt);toast('⛽ Out of fuel! Find a station.')}
   state.roadTime+=dt;
   state.spawn-=dt;
   if(state.spawn<=0){spawn();state.spawn=.65+Math.random()*1.1}
   vehicles.forEach(v=>{
    v.y+=(v.speed+state.speed*.55)*dt;v.el.style.top=v.y+'px';
    if(v.y>innerHeight+150){v.el.remove();v.dead=true}
    if(!v.dead&&hit(v.el,$('player'))){v.dead=true;v.el.remove();crash()}
   });
   vehicles=vehicles.filter(v=>!v.dead);
   // Every 18 seconds, a completed mission is simulated at the destination.
   if(state.roadTime>18){state.roadTime=0;finishJob()}
   if(state.fuel<20 && Math.random()<.002)refuel();
   updateHUD();
  }
  requestAnimationFrame(frame)
 }
 document.addEventListener('keydown',e=>{
  if(e.key in keys){keys[e.key]=true;e.preventDefault()}
  if(e.key==='p'||e.key==='Escape')togglePause();
  if(e.key.toLowerCase()==='f')refuel();
 });
 document.addEventListener('keyup',e=>{if(e.key in keys){keys[e.key]=false;e.preventDefault()}});
 document.querySelectorAll('.ctrl').forEach(btn=>{
  const k=btn.dataset.key;
  const down=e=>{e.preventDefault();keys[k]=true;btn.classList.add('active')};
  const up=e=>{e.preventDefault();keys[k]=false;btn.classList.remove('active')};
  btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up);
 });
 $('pauseBtn').onclick=()=>togglePause();
 $('startBtn').onclick=()=>state.gameOver?reset():togglePause(false);
 makeSkyline();updateHUD();togglePause(true);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
